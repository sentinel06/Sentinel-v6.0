kind = "api"
previewPath = "/api" # TODO - should be excluded from preview in the first place
title = "API Server"
version = "1.0.0"
id = "3B4_FFSkEVBkAeYMFRJ2e"

[[services]]
localPort = 8080
name = "API Server"
# In dev the dashboard runs on its own Vite workflow at "/", so the
# api-server only claims its API routes. In production the dashboard
# is bundled and served by this same Express process (see app.ts), so
# we override paths below to claim "/" as well.
paths = ["/api", "/api/v1/ws"]

[services.development]
run = "pnpm --filter @workspace/api-server run dev"

[services.production]
paths = ["/"]

[services.production.build]
# Build BOTH the dashboard (its vite output is served by Express in
# production — see app.ts) and the api-server. This makes the api-server
# the single autoscale deployable: one container, one port, one run command.
# Order matters: dashboard first so its dist/public exists when the
# api-server image is assembled.
args = [
  "pnpm",
  "--filter", "@workspace/sentinel-dashboard",
  "--filter", "@workspace/api-server",
  "run", "build",
]

[services.production.build.env]
NODE_ENV = "production"

[services.production.run]
# we don't run through pnpm to make startup faster in production
args = ["node", "--enable-source-maps", "artifacts/api-server/dist/index.mjs"]

[services.production.run.env]
PORT = "8080"
NODE_ENV = "production"

[services.production.health.startup]
path = "/api/healthz"
