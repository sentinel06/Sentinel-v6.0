kind = "web"
previewPath = "/"
title = "Agent-Sentinel Dashboard"
version = "1.0.0"
id = "artifacts/sentinel-dashboard"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25417

[services.development]
run = "pnpm --filter @workspace/sentinel-dashboard run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/sentinel-dashboard", "run", "build" ]
publicDir = "artifacts/sentinel-dashboard/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25417"
BASE_PATH = "/"
