name: Forensics-Protocol
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  gatekeeper:
    runs-on: ubuntu-latest
    environment: forensics-audit
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Force Handshake
        run: |
          echo "import crypto from 'crypto';" > simple-sign.js
          echo "const key = process.env.SOVEREIGN_KEY || 'MISSING';" >> simple-sign.js
          echo "const hash = crypto.createHmac('sha256', key).update('SENTINEL_v6_VALIDATE').digest('hex').toUpperCase();" >> simple-sign.js
          echo "console.log('[HANDSHAKE_GENERATE][' + hash + ']');" >> simple-sign.js
          node simple-sign.js
        env:
          SOVEREIGN_KEY: ${{ secrets.SOVEREIGN_KEY }}
