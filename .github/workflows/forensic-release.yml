name: Forensics-Protocol
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  gatekeeper:
    runs-on: ubuntu-latest
    environment: forensics-audit
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Dependencies
        run: npm install
      - name: Generate Sovereign Handshake
        run: npm start
        env:
          SOVEREIGN_KEY: ${{ secrets.SOVEREIGN_KEY }}
          GITHUB_ACTIONS: true
